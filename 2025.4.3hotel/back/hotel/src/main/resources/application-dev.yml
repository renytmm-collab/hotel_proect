# MySQL uses independent keys so legacy Oracle DB_* values cannot leak into this connection.
# Set MYSQL_* via environment variables or the ignored application-local.yml.
hotel:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    host: ${MYSQL_HOST:127.0.0.1}
    port: ${MYSQL_PORT:3306}
    database: ${MYSQL_DATABASE:hotel}
    username: ${MYSQL_USERNAME:}
    password: ${MYSQL_PASSWORD:}
