server:
  port: 8081
spring:
  # 加载本地私有配置：application-local.yml 已被 .gitignore 忽略，
  # optional: 前缀保证文件不存在时自动跳过、不报错
  config:
    import: optional:classpath:application-local.yml
  servlet:
    multipart:
      location:
      max-file-size: 10MB
      max-request-size: 12MB
  profiles:
    active: dev
  main:
    allow-circular-references: true
  datasource:
    driver-class-name: ${hotel.datasource.driver-class-name}
    url: jdbc:mysql://${hotel.datasource.host}:${hotel.datasource.port}/${hotel.datasource.database}?connectionTimeZone=GMT%2B8&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
    username: ${hotel.datasource.username}
    password: ${hotel.datasource.password}
#  redis:
#    host: ${hotel.redis.host}
#    port: ${hotel.redis.port}
#    password: ${hotel.redis.password}
#    database: ${hotel.redis.database}
mybatis:
  # mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.hotel_back.Pojo.Entity
  configuration:
    # 开启驼峰命名
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
logging:
  level:
    com:
      hotel:
        mapper: debug
        service: debug
        controller: info
hotel:
  deepseek:
    # 大模型 API Key 不写死在这里：用环境变量 DEEPSEEK_API_KEY 注入，
    # 或写进被 .gitignore 忽略的 application-local.yml（同名键）
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
  rag:
    # 知识库检索模式：keyword（无需额外服务） | vector（需 embedding） | hybrid
    retrieval-mode: ${RAG_RETRIEVAL_MODE:keyword}
    # 启动时自动导入 classpath:kb/*.md（按内容哈希幂等）
    auto-ingest: true
    doc-pattern: classpath:kb/*.md
    top-k: 3
    min-score: 0.3
    chunk-size: 300
    chunk-overlap: 60
  embedding:
    # none = 不启用向量；openai-compat = 兼容 OpenAI /embeddings 的服务（硅基流动/百炼/智谱/Ollama）
    provider: ${EMBEDDING_PROVIDER:none}
    base-url: ${EMBEDDING_BASE_URL:https://api.siliconflow.cn/v1}
    api-key: ${EMBEDDING_API_KEY:}
    model: ${EMBEDDING_MODEL:BAAI/bge-m3}
    dim: ${EMBEDDING_DIM:1024}
    timeout-ms: 20000
  jwt:
    # 设置jwt签名加密时使用的秘钥
    admin-secret-key: wx2004081429112911
    # 设置jwt过期时间
    admin-ttl: 7200000
    # 设置前端传递过来的令牌名称
    admin-token-name: token
    user-secret-key: wx200408142911
    user-ttl: 7200000
    user-token-name: token
# 文件上传配置
file:
  # 文件上传本地存储路径（支持环境变量覆盖）
  upload-path: ${HOTEL_UPLOAD_PATH:D:/Software_analyze/hotel_proect/2025.4.3hotel/upload}
  # 文件访问URL前缀
  access-url: /upload



